id: no-swallowed-catch
valid:
  - "try { run(); } catch (e) { throw e; }"
  - "try { run(); } catch (e) { throw new Error('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { return { ok: false, error: e }; }"
  - "try { run(); } catch (e) { if (retry(e)) { return null; } throw e; }"
  - "try { run(); } catch (e) { log(e); throw e; }"
  - "try { run(); } catch (e) { try { next(); } catch (x) { throw new Error('y', { cause: x }); } throw e; }"
  - "try { run(); } catch (e) { const fallback = { e: 1 }; if (c) { return fallback.e; } throw e; }"
  - "try { run(); } catch (cause) { throw new Error('x', { cause }); }"
  - "try { run(); } catch (e) { if (e instanceof TypeError) { throw new Error('tipo', { cause: e }); } else { throw e; } }"
  - "try { run(); } catch (e) { if (a) { return { ok: false, error: e }; } else { throw e; } }"
  - "try { run(); } catch (e) { log(e); if (a) { throw e; } else { return e; } }"
  - "try { run(); } catch (e) { if (e instanceof SyntaxError) { return { ok: false, kind: 'invalid-json' }; } throw e; }"
invalid:
  - "try { run(); } catch (e) {}"
  - "try { run(); } catch {}"
  - "try { run(); } catch (e) { return null; }"
  - "try { run(); } catch { return null; }"
  - "try { run(); } catch (e) { console.error(e); }"
  - "try { run(); } catch (e) { const m = String(e); console.error(m); }"
  - "try { run(); } catch (e) { log(e); }"
  - "try { run(); } catch { throw new Error('falhou'); }"
  - "try { run(); } catch (e) { throw new Error('falhou'); }"
  - "try { run(); } catch (e) { const f = () => { throw e; }; console.error(f); }"
  - "try { run(); } catch (e) { const f = function () { return e; }; console.error(f); }"
  - "try { run(); } catch (e) { items.map(() => { throw e; }); }"
  - "try { run(); } catch ({ message }) { return { message }; }"
  - "try { run(); } catch ({ message }) { throw new Error(message); }"
  - "try { run(); } catch (e) { try { next(); } catch (e) { throw e; } }"
  - "try { run(); } catch (e) { try { next(); } catch (x) { throw e; } }"
  - "try { run(); } catch (e) { try { next(); } catch (x) { return { error: e }; } }"
  - "try { run(); } catch (e) { try { next(); } catch (x) { if (c) { throw e; } throw new Error('y', { cause: x }); } }"
  - "try { run(); } catch (e) { return fallback.e; }"
  - "try { run(); } catch (e) { const o = { e: 1 }; return o; }"
  - "try { run(); } catch (e) { if (c) { throw e; } }"
  - "try { run(); } catch (e) { if (c) { throw e; } return null; }"
  - "try { run(); } catch (e) { if (c) { return { ok: false, error: e }; } else { return null; } }"
  - "try { run(); } catch (e) { switch (k) { case 1: throw e; } }"
  - "try { run(); } catch (e) { for (const x of xs) { if (x) { throw e; } } return null; }"
  - "try { run(); } catch (e) { throw e; log(e); }"
  - "try { run(); } catch (e) { if (a) { throw e; } else { return null; } }"
  - "try { run(); } catch (e) { if (a) { return null; } else { throw e; } }"
  - "try { run(); } catch (e) { if (a) { throw e; } else if (b) { throw e; } }"
  - "try { run(); } catch (e) { if (a) { throw e; } else if (b) { throw e; } else { throw e; } }"
