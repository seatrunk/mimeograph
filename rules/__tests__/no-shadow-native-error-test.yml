id: no-shadow-native-error
valid:
  - "class AppError extends Error {}"
  - "const error = new Error('x');"
  - 'import { x } from "y";'
  - "function wrap(e: unknown) { return new TypeError('x', { cause: e }); }"
  - "import { Error as ApiError } from 'x';"
  - "import type { Error as ApiError } from './api.ts';"
  - "const x = Error;"
  - "const { a: B } = c;"
  - "foo(Promise);"
  - "function f(a: Error) { return a; }"
  - "const o = { Error: 1 };"
  - "export { Foo as Error };"
  - "Object.defineProperty(target, 'Error', {});"
  - "const o = {}; o.name = 'x';"
  - "attach(window);"
  - "format(self);"
  - "seen.has(globalThis);"
  - "on(window, 'resize', fn);"
  - "JSON.stringify(globalThis);"
  - "self[k] = 1;"
  - "const { err = new Error('padrao') } = opts;"
  - "const { p = Promise.resolve(1) } = opts;"
  - "const [x = new TypeError('a')] = arr;"
  - "function f({ e = new RangeError('x') }: Opts) { return e; }"
  - "const { a: b = Promise.reject(new Error('x')) } = opts;"
  - "this.value = Promise.resolve(1);"
invalid:
  - "class Error {}"
  - "class TypeError extends Base {}"
  - "function RangeError() {}"
  - "const Error = AppError;"
  - "const AggregateError = Foo;"
  - "let URIError = Foo;"
  - 'import { Error } from "x";'
  - 'import { Foo as TypeError } from "x";'
  - "import Error from './fake.ts';"
  - "import * as Error from './fake.ts';"
  - "import Promise, { x } from './fake.ts';"
  - "const { a: Error } = c;"
  - "const { Error } = c;"
  - "const [Error] = c;"
  - "const { a: [Promise] } = c;"
  - "function f(Error: unknown) {}"
  - "function f(Error) {}"
  - "const f = (Error) => 1;"
  - "const f = Error => 1;"
  - "function f(...Error: unknown[]) {}"
  - "try { run(); } catch (Error) { throw Error; }"
  - "const Promise = { reject: () => null };"
  - "const globalThis = {};"
  - "let TypeError;"
  - "enum Error { A }"
  - "Error = Fake;"
  - "([Error] = [Fake]);"
  - "globalThis.Error = Fake;"
  - "globalThis['Error'] = Fake;"
  - "window.Promise = Fake;"
  - "global.TypeError = Fake;"
  - "for (const Error of xs) {}"
  - "x.Error = Fake;"
  - "holder.Promise = Fake;"
  - "Object.defineProperty(globalThis, 'Error', { value: Fake });"
  - "Object.assign(globalThis, { Promise: Fake });"
  - "Reflect.set(globalThis, 'Error', Fake);"
  - "Object.defineProperty(window, 'Promise', { value: Fake });"
  - "const g = globalThis; g.Error = Fake;"
  - "export default class Error {}"
  - "declare const Error: unknown;"
  - "Object.defineProperties(window, {});"
  - "Reflect.defineProperty(globalThis, 'Error', { value: Fake });"
  - "Reflect.set(self, 'Error', Fake);"
  - "const { Error = x } = opts;"
  - "const { a: Error = x } = opts;"
  - "const [Error = x] = arr;"
  - "const { a: { Promise = x } } = opts;"
  - "globalThis['Error'] = Fake;"
  - "self.Error = Fake;"
