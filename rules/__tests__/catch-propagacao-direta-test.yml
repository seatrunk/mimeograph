  - "try { run(); } catch (e) { throw new Error('falhou', { cause: e }, 1); }"
  - "try { run(); } catch (cause) { throw new Error('falhou', { cause }); }"
  - "try { run(); } catch (e) { return new Error('falhou', { cause: e }); }"
