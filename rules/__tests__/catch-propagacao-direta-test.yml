  - "try { run(); } catch (e) { return { ok: false, error: e } as unknown as Result; }"
  - "try { run(); } catch (e) { return { ok: false, error: e } satisfies Result; }"
  - "try { run(); } catch (e) { return { ok: false, error: e } as const satisfies Result; }"
  - "try { run(); } catch (e) { throw e satisfies Error; }"
