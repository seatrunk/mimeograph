  - "try { run(); } catch (e) { throw new TypeError('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new RangeError('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new SyntaxError('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new ReferenceError('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new EvalError('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new URIError('falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new AggregateError([], 'falhou', { cause: e }); }"
  - "try { run(); } catch (e) { throw new globalThis.Error('falhou', { cause: e }); }"
