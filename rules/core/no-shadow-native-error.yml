id: no-shadow-native-error
language: Tsx
severity: error
message: "Não declare, importe sem alias, desestruture, receba como parâmetro nem atribua com o nome de um erro nativo (Error, TypeError, RangeError, SyntaxError, ReferenceError, EvalError, URIError, AggregateError), nem de Promise ou globalThis, e não atribua a globalThis.Error e similares. A regra catch-propagacao-direta confia nesses nomes; use um nome próprio ou um alias (`import { Error as ApiError }`)."
files:
  - src/**
rule:
  any:
    - all:
        - any:
            - kind: identifier
            - kind: type_identifier
            - kind: shorthand_property_identifier_pattern
        - regex: "^(Error|TypeError|RangeError|SyntaxError|ReferenceError|EvalError|URIError|AggregateError|Promise|globalThis)$"
        - any:
            - inside:
                kind: variable_declarator
                field: name
            - all:
                - any:
                    - kind: identifier
                    - kind: shorthand_property_identifier_pattern
                - inside:
                    any:
                      - kind: object_pattern
                      - kind: array_pattern
                    stopBy: end
                - not:
                    inside:
                      any:
                        - kind: object_assignment_pattern
                        - kind: assignment_pattern
                      field: right
                      stopBy: end
            - inside:
                any:
                  - kind: required_parameter
                  - kind: optional_parameter
                field: pattern
            - inside:
                kind: formal_parameters
            - inside:
                kind: arrow_function
                field: parameter
            - inside:
                kind: rest_pattern
            - inside:
                kind: catch_clause
                field: parameter
            - inside:
                any:
                  - kind: class_declaration
                  - kind: class
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: generator_function
                  - kind: generator_function_declaration
                  - kind: enum_declaration
                field: name
            - inside:
                kind: import_clause
            - inside:
                kind: namespace_import
            - inside:
                kind: import_require_clause
            - inside:
                kind: import_specifier
                field: alias
            - all:
                - kind: identifier
                - inside:
                    kind: import_specifier
                    field: name
                - not:
                    inside:
                      kind: import_specifier
                      has:
                        field: alias
                        kind: identifier
            - inside:
                kind: assignment_expression
                field: left
            - inside:
                kind: for_in_statement
                field: left
    - kind: assignment_expression
      has:
        field: left
        kind: member_expression
        has:
          field: property
          kind: property_identifier
          regex: "^(Error|TypeError|RangeError|SyntaxError|ReferenceError|EvalError|URIError|AggregateError|Promise)$"
    - kind: assignment_expression
      has:
        field: left
        kind: subscript_expression
        has:
          field: object
          kind: identifier
          regex: "^(globalThis|global|window)$"
    - kind: call_expression
      all:
        - has:
            field: function
            kind: member_expression
            all:
              - has:
                  field: object
                  kind: identifier
                  regex: "^(Object|Reflect)$"
              - has:
                  field: property
                  kind: property_identifier
                  regex: "^(defineProperty|defineProperties|assign|set)$"
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: identifier
              regex: "^(globalThis|global|window|self)$"
